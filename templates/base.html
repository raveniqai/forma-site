<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F7F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1412" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="{{root}}favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="{{root}}favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">
<link rel="stylesheet" href="{{root}}style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{root}}"><img src="{{root}}favicon-32.png" width="28" height="28" alt="">{{short_name}}</a>
    <nav aria-label="Main">
{{nav}}
    </nav>
  </div>
</header>
<main id="main" class="wrap">
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>{{app_name}} gives information and suggestions, not medical advice.</p>
    <p>{{publisher}}.</p>
    <p><a href="{{root}}privacy/">Privacy</a> &middot; <a href="{{root}}terms/">Terms</a> &middot; <a href="{{root}}support/">Support</a></p>
  </div>
</footer>
</body>
</html>
